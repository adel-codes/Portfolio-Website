<!doctype html>
<!-- The social card (1200 x 630). Rendered by og.mjs from the site root so it
     uses the site's own fonts and the same round as the home page. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0b1526; }
  .og { position: relative; width: 1200px; height: 630px; color: #e8e6dd; font-family: "Schibsted Grotesk", sans-serif; }
  .og img.round { position: absolute; width: 760px; height: 760px; right: -170px; top: -65px; }
  .og .brand { position: absolute; left: 64px; top: 48px; display: flex; gap: 20px; align-items: center; }
  .og .brand img { width: 96px; height: 96px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
  .og .brand b { font-size: 21px; font-weight: 600; letter-spacing: -0.01em; display: block; }
  .og .brand span { font: 400 14px "Azeret Mono", monospace; opacity: .75; }
  .og h1 { position: absolute; left: 64px; top: 214px; width: 600px; margin: 0; font-size: 66px; line-height: 1.0; letter-spacing: -0.04em; font-weight: 500; }
  .og p { position: absolute; left: 64px; bottom: 56px; margin: 0; font: 400 15px/1.5 "Azeret Mono", monospace; color: #a6afbe; }
  .og .label { position: absolute; right: 72px; bottom: 112px; background: #f6f7f9; color: #0f1b2d; padding: 14px 16px; font-size: 14px; line-height: 1.4; rotate: -1.6deg; box-shadow: 0 18px 34px -12px rgba(0,0,0,.6); }
  .og .label i { font-weight: 600; }
  .og .label span { display: block; font: 400 11px "Azeret Mono", monospace; color: #4b5669; margin-top: 4px; }
</style></head>
<body><div class="og">
  <img class="round" src="assets/img/round-1400.avif" alt="">
  <div class="brand"><img src="assets/img/logo/alc-medallion-256.webp" alt=""><div><b>Australian Longevity Clinic</b><span>628 Ipswich Road, Annerley, Brisbane</span></div></div>
  <h1>Longevity medicine that reads before it treats.</h1>
  <p>IV therapy · peptides · testosterone · weight management</p>
  <div class="label"><i>Lagarostrobos franklinii</i>, Huon pine<span>Core PEB07A · 1,010 rings · AD 1003–2012</span></div>
</div></body></html>
