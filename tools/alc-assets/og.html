<!doctype html>
<!-- The social card (1200 x 630). Rendered by og.mjs from the site root so it
     uses the site's own fonts, the hero's data field and the lead doctors'
     photographs. The slip lists one route's real tests, from routes.mjs. -->
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Schibsted Grotesk"; src: url("assets/fonts/schibsted-grotesk-latin.woff2") format("woff2"); font-weight: 400 900; }
  @font-face { font-family: "Azeret Mono"; src: url("assets/fonts/azeret-mono-latin.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0b1526; }
  .og { position: relative; width: 1200px; height: 630px; color: #e8e6dd; font-family: "Schibsted Grotesk", sans-serif; }
  .og .field { position: absolute; width: 1500px; right: -520px; top: -40px; opacity: 0.14;
    -webkit-mask-image: radial-gradient(48% 60% at 62% 50%, #000 20%, transparent 100%); mask-image: radial-gradient(48% 60% at 62% 50%, #000 20%, transparent 100%); }
  .og .brand { position: absolute; left: 64px; top: 50px; display: flex; gap: 18px; align-items: center; }
  .og .brand img { width: 84px; height: 84px; }
  .og .brand b { font-size: 21px; font-weight: 600; letter-spacing: -0.01em; display: block; }
  .og .brand span { font: 400 14px "Azeret Mono", monospace; color: #a6afbe; }
  .og h1 { position: absolute; left: 64px; top: 196px; width: 600px; margin: 0; font-size: 70px; line-height: 0.98; letter-spacing: -0.04em; font-weight: 500; }
  .og p { position: absolute; left: 64px; bottom: 54px; margin: 0; font: 400 15px/1.5 "Azeret Mono", monospace; color: #a6afbe; }
  .og .prints { position: absolute; left: 720px; top: 62px; display: flex; gap: 18px; align-items: flex-start; }
  .og .prints figure { margin: 0; width: 196px; }
  .og .prints figure + figure { margin-top: 44px; }
  .og .prints img { display: block; width: 100%; background: #f6f7f9; padding: 6px; box-sizing: border-box; box-shadow: 0 16px 34px -14px rgba(0,0,0,.75); }
  .og .prints figcaption { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 9px; }
  .og .slip { position: absolute; left: 812px; top: 300px; width: 236px; padding: 14px 16px 16px; background: #e8eaee; color: #0f1b2d; box-shadow: 0 2px 3px rgba(0,0,0,.3), 0 22px 40px -18px rgba(0,0,0,.8); }
  .og .slip small { display: block; font: 400 11px/1.4 "Azeret Mono", monospace; color: #4b5669; }
  .og .slip b { display: block; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; margin: 5px 0 8px; }
  .og .slip ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid rgba(15,27,45,.16); }
  .og .slip li { font: 400 12px/1.35 "Azeret Mono", monospace; padding: 5px 0; border-bottom: 1px solid rgba(15,27,45,.1); }
</style></head>
<body><div class="og">
  <img class="field" src="assets/img/data-field-1600.webp" alt="">
  <div class="brand"><img src="assets/img/logo/alc-medallion-256.webp" alt=""><div><b>Australian Longevity Clinic</b><span>628 Ipswich Road, Annerley, Brisbane</span></div></div>
  <h1>Real peptide therapy, from real doctors.</h1>
  <p>Testosterone · weight loss · skin and hair · energy</p>
  <div class="prints">
    <figure><figcaption>Dr Raman Bohra</figcaption><img src="assets/img/doctors/dr-raman-bohra-2x.webp" alt=""></figure>
    <figure><figcaption>Dr Rekha Bohra</figcaption><img src="assets/img/doctors/dr-rekha-bohra-2x.webp" alt=""></figure>
  </div>
  <div class="slip"><small>Checked before anything is prescribed</small><b>Lose weight</b>
    <ul><li>Fasting glucose</li><li>Insulin</li><li>HbA1c</li><li>Lipid panel</li><li>Thyroid function</li></ul></div>
</div></body></html>
